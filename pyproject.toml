[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changeguard"
version = "0.1.0"
description = "Local-first pull request change investigation foundation"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-java>=0.23,<0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
changeguard = "changeguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["changeguard*", "evaluation*"]

[tool.setuptools.package-data]
changeguard = ["demo/*"]
evaluation = ["*.json"]
